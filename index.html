<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Homework Helper Translator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #chat {
      max-width: 420px;
      margin: auto;
      padding: 15px;
      border: 2px solid #002855;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      border-bottom: 1px solid #ccc;
      padding: 10px;
      text-align: left;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
    }
    .user {
      align-self: flex-start;
      background-color: #e1f5fe;
    }
    .ai {
      align-self: flex-end;
      background-color: #fff3e0;
    }
    input[type="text"], select {
      width: 80%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #002855;
      border-radius: 4px;
    }
    button {
      padding: 10px 14px;
      background: #ffb300;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background: #cc8c00;
    }
    #voiceBtn {
      background-color: #4caf50;
    }
    #voiceBtn.recording {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div id="chat">
    <label>Speak/Type Language:</label>
    <select id="inputLang">
      <option value="english">English</option>
      <option value="spanish">Español</option>
      <option value="arabic">العربية</option>
    </select><br>

    <label>Response Language:</label>
    <select id="responseLang">
      <option value="english">English</option>
      <option value="spanish">Español</option>
      <option value="arabic">العربية</option>
    </select><br>

    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Ask your question..." /><br>
    <button onclick="sendMessage()">Send</button>
    <button onclick="clearChat()">Clear Chat</button><br>
    <button id="voiceBtn">🎙️ Hold to Ask</button><br>
    <button onclick="stopSpeaking()">🛑 Stop</button>
    <button onclick="togglePause()">⏸️ Pause / ▶️ Resume</button>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const voiceBtn = document.getElementById("voiceBtn");
    let recognition;

    const langMap = {
      english: { code: "en-US", name: "English" },
      spanish: { code: "es-ES", name: "Spanish" },
      arabic:  { code: "ar-SA", name: "Arabic" }
    };

    let chatHistory = [];

    function getLang(key) {
      return langMap[document.getElementById(key).value];
    }

    function getSystemPrompt() {
      const resLang = getLang("responseLang");
      return `You are a helpful tutor. Translate or explain clearly in ${resLang.name}.`;
    }

    function resetChatHistory() {
      chatHistory = [{ role: "system", content: getSystemPrompt() }];
    }

    resetChatHistory();

    function addMessage(text, role) {
      const msg = document.createElement("div");
      msg.className = "message " + role;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const userInput = document.getElementById("userInput").value.trim();
      if (!userInput) return;

      addMessage(userInput, "user");
      chatHistory.push({ role: "user", content: userInput });
      document.getElementById("userInput").value = "";

      try {
        const response = await fetch("https://sweet-jumpy-broker.glitch.me/homework", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory })
        });

        const data = await response.json();
        const reply = data.reply;

        addMessage(reply, "ai");
        speak(reply);
        chatHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        console.error("Error:", err);
        addMessage("Something went wrong. Please try again.", "ai");
      }
    }

    function clearChat() {
      messages.innerHTML = "";
      resetChatHistory();
    }

    // 🎙️ Hold-to-Talk
    voiceBtn.addEventListener("mousedown", startListening);
    voiceBtn.addEventListener("mouseup", stopListening);
    voiceBtn.addEventListener("touchstart", startListening);
    voiceBtn.addEventListener("touchend", stopListening);

    function startListening() {
      const inputLang = getLang("inputLang");
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = inputLang.code;
      recognition.interimResults = false;

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
        sendMessage();
      };

      recognition.onerror = function (event) {
        console.error("Voice error:", event.error);
        addMessage("Voice error: " + event.error, "ai");
      };

      voiceBtn.classList.add("recording");
      recognition.start();
    }

    function stopListening() {
      if (recognition) {
        recognition.stop();
        voiceBtn.classList.remove("recording");
      }
    }

    function speak(text) {
      const resLang = getLang("responseLang");
      const synth = window.speechSynthesis;

      function speakNow() {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = resLang.code;
        const voice = synth.getVoices().find(v => v.lang === resLang.code);
        if (voice) utter.voice = voice;

        synth.cancel();
        synth.speak(utter);
      }

      if (synth.getVoices().length === 0) {
        synth.onvoiceschanged = () => speakNow();
      } else {
        speakNow();
      }
    }

    function stopSpeaking() {
      window.speechSynthesis.cancel();
    }

    function togglePause() {
      const synth = window.speechSynthesis;
      if (synth.speaking) {
        synth.paused ? synth.resume() : synth.pause();
      }
    }

    document.getElementById("inputLang").addEventListener("change", () => {
      clearChat();
    });

    document.getElementById("responseLang").addEventListener("change", () => {
      clearChat();
    });
  </script>
</body>
</html>
