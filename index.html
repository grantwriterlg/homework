<script>
    async function sendMessage() {
        const userInput = document.getElementById("userInput").value.trim();
        const imageInput = document.getElementById("imageInput").files[0];
        const messages = document.getElementById("messages");

        if (!userInput && !imageInput) return;

        messages.innerHTML += `<p><b>You:</b> ${userInput || '[Image uploaded]'}</p>`;
        document.getElementById("userInput").value = "";
        document.getElementById("imageInput").value = "";

        const formData = new FormData();
        formData.append("message", userInput);
        if (imageInput) {
            formData.append("image", imageInput);
        }

        try {
            const response = await fetch("https://sweet-jumpy-broker.glitch.me/homework", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            messages.innerHTML += `<p><b>AI:</b> ${data.reply}</p>`;
            messages.scrollTop = messages.scrollHeight;
        } catch (err) {
            console.error("Error:", err);
            messages.innerHTML += `<p><b>AI:</b> Sorry, something went wrong. Please try again.</p>`;
        }
    }
</script>
