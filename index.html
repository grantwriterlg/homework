<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework Helper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #chat {
            max-width: 400px;
            margin: auto;
            padding: 15px;
            border: 2px solid #002855;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        #messages {
            height: 320px;
            overflow-y: auto;
            border-bottom: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            background: #fff;
        }
        input[type="text"], input[type="file"] {
            width: 75%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #002855;
            border-radius: 4px;
        }
        button {
            padding: 10px 14px;
            background: #ffb300;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background: #cc8c00;
        }
    </style>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="Ask a homework question..."><br>
        <input type="file" id="imageInput" accept="image/*"><br>
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const maxFreeTries = 3;
        let usage = parseInt(localStorage.getItem("homework_tries") || "0");

        async function sendMessage() {
            if (usage >= maxFreeTries) {
                alert("You've used your 3 free questions. Please subscribe to continue.");
                return;
            }

            const userInput = document.getElementById("userInput").value.trim();
            const imageInput = document.getElementById("imageInput").files[0];
            const messages = document.getElementById("messages");

            if (!userInput && !imageInput) return;

            messages.innerHTML += `<p><b>You:</b> ${userInput || '[Image uploaded]'}</p>`;
            document.getElementById("userInput").value = "";
            document.getElementById("imageInput").value = "";

            usage++;
            localStorage.setItem("homework_tries", usage.toString());

            const formData = new FormData();
            formData.append("message", userInput);
            if (imageInput) {
                formData.append("image", imageInput);
            }

            try {
                const response = await fetch("https://sweet-jumpy-broker.glitch.me/homework", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                messages.innerHTML += `<p><b>AI:</b> ${data.reply}</p>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                console.error("Error:", err);
                messages.innerHTML += `<p><b>AI:</b> Sorry, something went wrong. Please try again.</p>`;
            }
        }
    </script>
</body>
</html>
