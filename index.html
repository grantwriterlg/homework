<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Homework Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #chat {
      max-width: 400px;
      margin: auto;
      padding: 15px;
      border: 2px solid #002855;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    #messages {
      height: 320px;
      overflow-y: auto;
      border-bottom: 1px solid #ccc;
      padding: 10px;
      text-align: left;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
    }
    .user {
      align-self: flex-start;
      background-color: #e1f5fe;
    }
    .ai {
      align-self: flex-end;
      background-color: #fff3e0;
    }
    input[type="text"], select {
      width: 75%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #002855;
      border-radius: 4px;
    }
    button {
      padding: 10px 14px;
      background: #ffb300;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background: #cc8c00;
    }
    #voiceBtn {
      background-color: #4caf50;
    }
    #voiceBtn.recording {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div id="chat">
    <select id="languageSelect">
      <option value="english">English</option>
      <option value="spanish">Español</option>
      <option value="arabic">العربية</option>
    </select><br>

    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Ask a homework question..." /><br>
    <button onclick="sendMessage()">Send</button>
    <button onclick="clearChat()">Clear Chat</button><br>
    <button id="voiceBtn">🎙️ Hold to Ask</button>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const voiceBtn = document.getElementById("voiceBtn");
    let recognition;

    const langSettings = {
      english: {
        speakLang: "en-US",
        system: "You are a helpful tutor that only responds in English. Explain clearly and simply.",
      },
      spanish: {
        speakLang: "es-ES",
        system: "Eres un tutor útil que solo responde en español. Explica de forma clara y sencilla.",
      },
      arabic: {
        speakLang: "ar-SA",
        system: "أنت معلم مفيد يجيب فقط باللغة العربية. اشرح بطريقة واضحة وبسيطة.",
      }
    };

    function getSelectedLanguage() {
      return document.getElementById("languageSelect").value;
    }

    let chatHistory = [];

    function resetChatHistory() {
      const lang = getSelectedLanguage();
      chatHistory = [{ role: "system", content: langSettings[lang].system }];
    }

    resetChatHistory();

    function addMessage(text, role) {
      const msg = document.createElement("div");
      msg.className = "message " + role;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const userInput = document.getElementById("userInput").value.trim();
      if (!userInput) return;

      addMessage(userInput, "user");
      chatHistory.push({ role: "user", content: userInput });
      document.getElementById("userInput").value = "";

      try {
        const response = await fetch("https://sweet-jumpy-broker.glitch.me/homework", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory })
        });

        const data = await response.json();
        const reply = data.reply;

        addMessage(reply, "ai");
        speak(reply);
        chatHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        console.error("Error:", err);
        addMessage("Something went wrong. Please try again.", "ai");
      }
    }

    function clearChat() {
      messages.innerHTML = "";
      resetChatHistory();
    }

    // 🎤 Hold-to-Talk Button
    voiceBtn.addEventListener("mousedown", startListening);
    voiceBtn.addEventListener("mouseup", stopListening);
    voiceBtn.addEventListener("touchstart", startListening);
    voiceBtn.addEventListener("touchend", stopListening);

    function startListening() {
      const lang = langSettings[getSelectedLanguage()];
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = lang.speakLang;
      recognition.interimResults = false;

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
        sendMessage();
      };

      recognition.onerror = function (event) {
        console.error("Voice error:", event.error);
        addMessage("Voice error: " + event.error, "ai");
      };

      voiceBtn.classList.add("recording");
      recognition.start();
    }

    function stopListening() {
      if (recognition) {
        recognition.stop();
        voiceBtn.classList.remove("recording");
      }
    }

    function speak(text) {
      const lang = langSettings[getSelectedLanguage()];
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang.speakLang;
      window.speechSynthesis.speak(utter);
    }

    document.getElementById("languageSelect").addEventListener("change", () => {
      clearChat();
    });
  </script>
</body>
</html>
